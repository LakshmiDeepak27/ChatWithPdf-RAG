# ==============================================================================
# TalkToPdf Local Development Docker Compose Configuration
# Note: For local development only. Production utilizes managed cloud services.
# ==============================================================================

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: talktopdf_valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: talktopdf_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: talktopdf_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - FRONTEND_URL=http://localhost:3000
      - REDIS_URL=redis://valkey:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=pdf_documents
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - MAX_FILE_SIZE_MB=50
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker
    container_name: talktopdf_worker
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - REDIS_URL=redis://valkey:6379
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=pdf_documents
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - WORKER_CONCURRENCY=2
    volumes:
      - shared_uploads:/app/uploads
    depends_on:
      valkey:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        - NEXT_PUBLIC_API_BASE_URL=http://localhost:5000
    container_name: talktopdf_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - backend

volumes:
  valkey_data:
  qdrant_data:
  shared_uploads: